<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <!-- Open Graph meta tags -->
    <meta property="og:title" content="Molly - Single Page Design" />
    <meta
      property="og:description"
      content="A modern, fully responsive Results Summary component featuring semantic markup and accessible UI design.."
    />
    <meta
      property="og:image"
      content="https://momo97x.github.io/Result-Summery-Component/assets/images/desktop-preview.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Preview of the Results Summary Component project"
    />

    <title>Frontend Mentor | Results summary component</title>
    <meta
      name="description"
      content="A responsive Results Summary Component built with HTML5, CSS3, and modern Flexbox/Grid techniques. Fully accessible and designed based on Frontend Mentor standards."
    />

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      * {
        box-sizing: border-box;
      }

      @font-face {
        font-family: hankenMedium;
        src: url(/assets/fonts/static/HankenGrotesk-Medium.ttf);
        font-weight: 500;
      }

      @font-face {
        font-family: hankenBold;
        src: url(/assets/fonts/static/HankenGrotesk-Bold.ttf);
        font-weight: 700;
      }

      @font-face {
        font-family: hankenExtraBold;
        src: url(/assets/fonts/static/HankenGrotesk-ExtraBold.ttf);
        font-weight: 800;
      }

      :root {
        /* primary colors */
        --Light-red: #ff5757;
        --Orangey-yellow: #ffb01f;
        --Green-teal: #00bd91;
        --Cobalt-blue: #1125d4;
        /* gradients */
        --Light-slate-blue-background: #7857ff;
        --Light-royal-blue-background: #2e2be9;
        --Violet-blue-circle: #4e21ca;
        --Persian-blue-circle: #2421ca00;
        /* Neutral colros */
        --White: #ffffff;
        --Pale-blue: #ebf1ff;
        --Light-lavender: #c8c7ff;
        --Dark-gray-blue: #303b5a;
        /* font size */
        --font-size-paragraphs: 1.125rem;
      }

      body {
        display: grid;
        place-content: center;
        margin: 0;
        min-height: 100vh;
        background-color: var(--Pale-blue);
      }

      ul {
        padding: 0;
        list-style: none;
      }

      /* Mobile-First approace */

      .container {
        /* Fluid width: Never smaller than 345px, preferred 90% of screen, max 736px */
        width: clamp(21.5rem, 100vw, 46rem);

        /* Flex layout defaults to stacked on mobile */
        display: flex;
        flex-direction: column;
        margin-inline: auto;
        overflow: hidden;
        background-color: var(--White);
      }

      /* result start */

      .result-card .result-section {
        padding: 1.25rem;
        text-align: center;
        font-family:
          hankenMedium,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        border-end-start-radius: 1.25rem;
        border-end-end-radius: 1.25rem;
        background-image: linear-gradient(
          0deg,
          var(--Light-royal-blue-background),
          var(--Light-slate-blue-background)
        );
        display: grid;
        grid-template-columns: 1fr;
        justify-items: center;
      }

      .result-section .section-title {
        font-size: 1.25rem;
        color: var(--Light-lavender);
      }

      .result-section .score-circle {
        display: grid;
        place-content: center;
        width: 9.375rem;
        height: 9.375rem;
        border-radius: 50%;
        background-image: linear-gradient(
          0deg,
          var(--Persian-blue-circle),
          var(--Violet-blue-circle)
        );
      }

      .result-section .score-circle .score-number {
        margin: 0;
        font-size: 3.75rem;
        font-family:
          hankenExtraBold,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        color: var(--White);
      }

      .result-section .score-circle .score-total {
        margin: 0;
        font-size: 0.75rem;
        color: var(--Light-lavender);
      }

      .result-section .score-status {
        margin-bottom: 0.5rem;
        font-size: 1.65rem;
        color: var(--White);
      }

      .result-section .score-description {
        margin-top: 0;
        max-width: 75%;
        color: var(--Pale-blue);
        opacity: 0.8;
      }

      /* summary start */

      .summary-section {
        padding: 1.25rem;
        background-color: var(--White);
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .summary-section .section-title {
        margin: 0;
        font-size: 1.125rem;
        font-family:
          hankenMedium,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }

      .summary-section .summary-list {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .summary-list .summary-item {
        padding-inline: 0.625rem;
        font-family:
          hankenExtraBold,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .summary-list .category-info {
        display: flex;
      }

      .category-info .category-name {
        margin-left: 0.625rem;
      }

      .summary-list .category-score {
        /* color: rgba(200, 199, 255, 0.5); */
        color: rgba(165, 165, 165);
      }

      .category-score .score-obtained {
        color: var(--Dark-gray-blue);
      }

      .summary-item.item-reaction {
        color: var(--Light-red);
        background-color: rgba(255, 87, 87, 0.05);
        border-radius: 0.625rem;
      }

      .summary-item.item-memory {
        color: var(--Orangey-yellow);
        background-color: rgb(255, 176, 31, 0.05);
        border-radius: 0.625rem;
      }

      .summary-item.item-verbal {
        color: var(--Green-teal);
        background-color: rgba(0, 189, 145, 0.05);
        border-radius: 0.625rem;
      }

      .summary-item.item-visual {
        color: var(--Cobalt-blue);
        background-color: rgba(17, 37, 212, 0.05);
        border-radius: 0.625rem;
      }

      .summary-section .btn-continue {
        width: 100%;
        padding: 1.25rem;
        border-radius: 1.875rem;
        border: none;
        color: var(--White);
        background-color: var(--Dark-gray-blue);
        cursor: pointer;
        font-size: 1.125rem;
        font-family:
          hankenMedium,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        transition: 0.3s;
      }

      .summary-section .btn-continue:hover,
      .summary-section .btn-continue:focus {
        background-image: linear-gradient(
          0deg,
          var(--Light-royal-blue-background),
          var(--Light-slate-blue-background)
        );
      }

      /* large screen */
      @media (min-width: 40.625rem) {
        .container {
          border-radius: 1.25rem;
          flex-direction: row;
        }

        /* Make both panels share equal 50% width */
        .result-section,
        .summary-section {
          flex: 1;
        }

        .result-card {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          border-radius: 1.25rem;
        }

        .result-card .result-section {
          border-radius: 1.25rem;
          justify-content: center;
        }

        .summary-section {
          border-start-end-radius: 1.25rem;
          border-end-end-radius: 1.25rem;
        }
      }

      /*.attribution {font-size: 0.6875rem;text-align: center;}
              .attribution a {color: #3d52a3;} */
    </style>
  </head>
  <body>
    <main class="container">
      <article class="result-card">
        <!-- Left Panel: Main Score Result -->
        <section class="result-section">
          <h2 class="section-title">Your Result</h2>

          <div class="score-circle">
            <p class="score-number">76</p>
            <p class="score-total">of 100</p>
          </div>

          <h3 class="score-status">Great</h3>
          <p class="score-description">
            You scored higher than 65% of the people who have taken these tests.
          </p>
        </section>

        <!-- Right Panel: Category Summary -->
        <section class="summary-section">
          <h2 class="section-title">Summary</h2>

          <ul class="summary-list">
            <li class="summary-item item-reaction">
              <div class="category-info">
                <img
                  src="/assets/images/icon-reaction.svg"
                  alt=""
                  aria-hidden="true"
                />
                <span class="category-name">Reaction</span>
              </div>
              <p class="category-score">
                <span class="score-obtained">80</span> / 100
              </p>
            </li>

            <li class="summary-item item-memory">
              <div class="category-info">
                <img
                  src="/assets/images/icon-memory.svg"
                  alt=""
                  aria-hidden="true"
                />
                <span class="category-name">Memory</span>
              </div>
              <p class="category-score">
                <span class="score-obtained">92</span> / 100
              </p>
            </li>

            <li class="summary-item item-verbal">
              <div class="category-info">
                <img
                  src="/assets/images/icon-verbal.svg"
                  alt=""
                  aria-hidden="true"
                />
                <span class="category-name">Verbal</span>
              </div>
              <p class="category-score">
                <span class="score-obtained">61</span> / 100
              </p>
            </li>

            <li class="summary-item item-visual">
              <div class="category-info">
                <img
                  src="/assets/images/icon-visual.svg"
                  alt=""
                  aria-hidden="true"
                />
                <span class="category-name">Visual</span>
              </div>
              <p class="category-score">
                <span class="score-obtained">73</span> / 100
              </p>
            </li>
          </ul>

          <button type="button" class="btn-continue">Continue</button>
        </section>
      </article>
    </main>

    <!--  Your Result 76 of 100 Great You scored higher than 65% of the people who
    have taken these tests. Summary Reaction 80 / 100 Memory 92 / 100 Verbal 61
    / 100 Visual 72 / 100 Continue -->

  </body>
</html>
